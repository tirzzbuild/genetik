name: Build APK ke-2

run-name: ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL of the source ZIP (GitHub Release asset or public URL)"
        required: true
        type: string
      tag:
        description: "Unique build tag / run name"
        required: true
        type: string
      build_type:
        description: "debug or release"
        required: false
        default: "release"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (dummy, we download ZIP)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .
          sparse-checkout-cone-mode: false

      - name: Download source ZIP
        id: download
        run: |
          set -euo pipefail
          echo "Downloading source from: ${{ inputs.zip_url }}"
          curl -L --fail --retry 3 --retry-delay 5 -o source.zip "${{ inputs.zip_url }}"
          if [ ! -s source.zip ]; then
            echo "ERROR: Downloaded file is empty"
            exit 1
          fi
          file source.zip || true
          unzip -l source.zip | head -40
          mkdir -p project
          unzip -q source.zip -d project
          # If single top-level dir, move contents up
          if [ "$(find project -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && [ "$(find project -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            TOP=$(find project -mindepth 1 -maxdepth 1 -type d | head -1)
            mv "$TOP"/* project/ 2>/dev/null || true
            mv "$TOP"/.[!.]* project/ 2>/dev/null || true
            rmdir "$TOP" 2>/dev/null || true
          fi
          ls -la project
          echo "PROJECT_DIR=project" >> $GITHUB_ENV

      - name: Detect project type
        id: detect
        run: |
          set -euo pipefail
          cd project
          if [ -f pubspec.yaml ]; then
            echo "type=flutter" >> $GITHUB_OUTPUT
            echo "Detected Flutter project"
          elif [ -f build.gradle ] || [ -f app/build.gradle ] || [ -f settings.gradle ]; then
            echo "type=android" >> $GITHUB_OUTPUT
            echo "Detected native Android project"
          else
            echo "type=unknown" >> $GITHUB_OUTPUT
            echo "WARNING: Could not detect Flutter or Android project structure"
            find . -maxdepth 3 -type f | head -50
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter pub get
        if: steps.detect.outputs.type == 'flutter'
        working-directory: project
        run: |
          flutter --version
          flutter pub get

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: project
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ inputs.build_type }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
            APK_PATH=$(find build/app/outputs -name "*.apk" | head -1)
          else
            flutter build apk --release
            APK_PATH=$(find build/app/outputs/flutter-apk -name "*-release.apk" 2>/dev/null || find build/app/outputs -name "*.apk" | head -1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found after build"
            find build -name "*.apk" || true
            exit 1
          fi
          echo "APK built: $APK_PATH"
          ls -lh "$APK_PATH"
          # Basic validity: size > 100KB and is ZIP-based
          SIZE=$(stat -c%s "$APK_PATH")
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK too small ($SIZE bytes)"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/artifacts/app-release.apk"
          echo "APK_PATH=$GITHUB_WORKSPACE/artifacts/app-release.apk" >> $GITHUB_ENV

      - name: Build native Android APK (Gradle)
        if: steps.detect.outputs.type == 'android'
        working-directory: project
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
          else
            echo "No gradlew found, trying gradle"
            gradle assembleRelease || true
          fi
          APK_PATH=$(find . -path "*/outputs/apk/*/release/*.apk" -o -path "*/outputs/apk/release/*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found after Gradle build"
            find . -name "*.apk" || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/artifacts/app-release.apk"
          echo "APK_PATH=$GITHUB_WORKSPACE/artifacts/app-release.apk" >> $GITHUB_ENV

      - name: Fail if no APK
        if: steps.detect.outputs.type == 'unknown'
        run: |
          echo "ERROR: Unsupported project type. Only Flutter (pubspec.yaml) or Android Gradle projects are supported for Build APK ke-2."
          exit 1

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="${APK_PATH:-$GITHUB_WORKSPACE/artifacts/app-release.apk}"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file missing"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          # APK is a ZIP
          if ! unzip -t "$APK" > /dev/null 2>&1; then
            echo "ERROR: APK is not a valid ZIP archive"
            exit 1
          fi
          echo "APK validation passed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: artifacts/app-release.apk
          if-no-files-found: error
          retention-days: 7
